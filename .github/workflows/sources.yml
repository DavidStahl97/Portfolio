name: Check the factsheet sources

# The smoke test of the fetch layer: do the six factsheets still arrive, is each of
# them the index we asked for, and does the parser still read their country tables?
#
# Runs on a push that touches the scripts, because that is when the answer can change,
# and on demand.
#
# On a branch it also writes the region CSVs and commits them. Those files are data,
# and the only place with a network is here - a working copy has no way to produce
# them. On the default branch it does not: there, data arrives the way it always has,
# through the pull request of `data.yml`, and the merge is the approval.
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/sources.yml"

permissions: {}

concurrency:
  group: sources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sources:
    name: Fetch and read every registered issue
    runs-on: ubuntu-latest
    permissions:
      contents: write # only to commit the region CSVs, and only off the default branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Exits with code 1 if an issue cannot be fetched, is the wrong index, fails a
      # check or if two regions claim the same country. The log carries the report,
      # including the country table when the parser could not read it.
      #
      # --write puts the country tables it has just read into data/. One pass over the
      # six factsheets, not two: update.py would download every one of them again.
      - name: Check the factsheet sources
        run: python scripts/check_sources.py --write

      - name: Commit the region CSVs if they changed
        if: github.ref_name != github.event.repository.default_branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/region_*.csv
          if git diff --cached --quiet; then
            echo "The region CSVs are unchanged - nothing to commit."
            exit 0
          fi
          git commit -m "Region country tables ${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
