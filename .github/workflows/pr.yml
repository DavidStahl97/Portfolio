name: Pull Request pruefen

# Baut die Seite zu einem Pull Request und haengt sie als Artefakt an den Lauf,
# damit sie sich vor dem Merge ansehen laesst.
on:
  pull_request:

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Seite bauen
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-site
        with:
          name: seite-pr-${{ github.event.pull_request.number }}
