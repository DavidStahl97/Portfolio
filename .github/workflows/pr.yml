name: Check pull request

# Builds the site for a pull request and attaches it to the run as an artifact,
# so that it can be reviewed before the merge.
on:
  pull_request:

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-site
        with:
          name: site-pr-${{ github.event.pull_request.number }}
