name: Portfolio-Report

# Manuell startbar (Actions -> Portfolio-Report -> Run workflow).
# Der Zeitplan ist bewusst auskommentiert - die BIP-Gewichte aendern sich nur
# beim jaehrlichen FTSE-Review im Maerz, ein monatlicher Lauf reicht voellig:
# on:
#   schedule:
#     - cron: "0 6 5 * *"   # 5. jedes Monats, 06:00 UTC
on:
  workflow_dispatch:
    inputs:
      split:
        description: "Anteil Marktkapitalisierung (0.5 = 50/50)"
        required: false
        default: "0.5"
      issue:
        description: "FTSE IssueName des Factsheets"
        required: false
        default: "GDPWLDS"
      commit:
        description: "Aktualisierte CSVs zurueck ins Repo committen"
        type: boolean
        required: false
        default: true
      publish:
        description: "Report nach Freigabe auf GitHub Pages veroeffentlichen"
        type: boolean
        required: false
        default: true

permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # 1) Erzeugen. Laeuft ohne Freigabe durch und legt alles als Artefakt ab -
  #    das ist der Stand, den du vor der Veroeffentlichung pruefst.
  # ---------------------------------------------------------------------------
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # nur fuer den Commit der CSV-Zeitreihe
    # Zwei parallele Laeufe wuerden sich beim Zurueckpushen in die Quere kommen.
    concurrency:
      group: portfolio-report-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      as_of: ${{ steps.run.outputs.as_of }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Factsheet laden, pruefen und Report erzeugen
        id: run
        run: |
          python scripts/update.py \
            --issue "${{ inputs.issue }}" \
            --split "${{ inputs.split }}" | tee run.log
          echo "as_of=$(ls data/report_*.html | tail -1 | grep -oE '[0-9]{8}')" >> "$GITHUB_OUTPUT"

      # Laeuft nur bei gruenem Lauf: fehlgeschlagene Pruefungen duerfen die
      # Zeitreihe nicht verfaelschen. Ist inhaltlich nichts neu (gleicher
      # Stichtag, gleiche Zahlen), entsteht auch kein Commit.
      - name: Zeitreihe committen
        if: success() && inputs.commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv data/run_*.json
          if git diff --cached --quiet; then
            echo "Keine Aenderung an den CSVs - nichts zu committen."
            exit 0
          fi
          git commit -m "Zielgewichte ${{ steps.run.outputs.as_of }} (Split ${{ inputs.split }})"
          git push origin "HEAD:${{ github.ref_name }}"

      # Die Seite: alle Stichtage, jeder Report aus den versionierten Daten
      # neu gebaut, dazu die CSVs und Pruefprotokolle zum Direktabruf.
      - name: Seite bauen
        if: success() && inputs.publish
        run: python scripts/build_site.py --out site
          echo "Seiteninhalt:" && find site -type f | sort

      - name: Seite als Pages-Artefakt hochladen
        if: success() && inputs.publish
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "## Portfolio-Report"
            echo
            echo '```'
            cat run.log 2>/dev/null || echo "kein Log - Lauf abgebrochen"
            echo '```'
            echo
            echo "Report und Daten liegen als Artefakt **portfolio-report** an diesem Lauf."
            if [ "${{ inputs.publish }}" = "true" ]; then
              echo "Die Veroeffentlichung auf GitHub Pages wartet auf deine Freigabe"
              echo "(Job \`deploy\`, Environment \`github-pages\`)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-report${{ steps.run.outputs.as_of && format('-{0}', steps.run.outputs.as_of) || '' }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            data/report_*.html
            data/target_weights_*.csv
            data/ftse_country_weights_*.csv
            data/run_*.json
            data/factsheets/*.pdf
            run.log

  # ---------------------------------------------------------------------------
  # 2) Veroeffentlichen. Haengt am Environment `github-pages`; sind dort
  #    "Required reviewers" hinterlegt, bleibt dieser Job stehen, bis du im
  #    Actions-Lauf auf "Review deployments" -> "Approve and deploy" klickst.
  #    Bis dahin ist auf der Seite weiterhin der vorige Report zu sehen.
  # ---------------------------------------------------------------------------
  deploy:
    needs: report
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Auf GitHub Pages veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
