name: Publish site

# Every change on main goes live: code as well as data. The merge is the approval.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One deploy after the other; do not cancel running ones, otherwise the site is
# left standing halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export data
        # No download, no parsing: the checked raw data are in the repository.
        # If data/ is still empty the site goes up anyway - it then says itself
        # that the first data run is missing.
        run: python scripts/export_data.py --out web/static || echo "no data yet - site without as-of dates"

      - name: Install the app
        run: npm ci
        working-directory: web

      - name: Check the app
        run: npm run check
        working-directory: web

      - name: Build the app
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: BUILD_DATE=$(date -u +%Y-%m-%d) npm run build
        working-directory: web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
