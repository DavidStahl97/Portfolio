name: Build site
description: >
  Exports the versioned data, checks and builds the app and uploads it as an
  artifact - without a path prefix, so that it can be opened locally at the root
  after downloading.

inputs:
  name:
    description: Name of the artifact
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      shell: bash
      run: pip install -r requirements.txt

    - name: Export data
      shell: bash
      run: python scripts/export_data.py --out web/static

    - name: Install the app
      shell: bash
      run: npm ci
      working-directory: web

    - name: Check the app
      shell: bash
      run: npm run check
      working-directory: web

    - name: Build the app
      shell: bash
      env:
        BASE_PATH: ""
        BUILD_DIR: "../preview"
      run: BUILD_DATE=$(date -u +%Y-%m-%d) npm run build
      working-directory: web

    - name: Instructions into the summary
      shell: bash
      run: |
        {
          echo "## Site for review"
          echo
          echo "Download the artifact **${{ inputs.name }}**, unpack it and serve it:"
          echo
          echo '```bash'
          echo "npx serve preview        # or: python3 -m http.server -d preview"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: preview
        if-no-files-found: error
        retention-days: 30
